add_code:
  name: Add Code
  description: Add a new PIN code to the lock
  fields:
    name:
      name: Name
      description: Friendly name for this code
      required: true
      example: "Guest User"
      selector:
        text:
    pin_code:
      name: PIN Code
      description: 4-6 digit PIN code
      required: true
      example: "123456"
      selector:
        text:
    type:
      name: Type
      description: Code type (permanent or guest)
      required: true
      default: guest
      example: guest
      selector:
        select:
          options:
            - permanent
            - guest
    expiry:
      name: Expiry Date
      description: >-
        Expiry date/time (ISO format YYYY-MM-DD, required for guest codes).
        Add a time (YYYY-MM-DDTHH:MM) for an exact expiry moment — otherwise
        the code stays valid through the end of the given day.
      example: "2026-12-31T09:00"
      selector:
        datetime:
    start:
      name: Start Date
      description: >-
        Scheduled start date/time (ISO format YYYY-MM-DD, or YYYY-MM-DDTHH:MM
        for an exact time). If set in the future, the code is stored but its
        PIN is not sent to the lock until this moment arrives — it simply
        won't work at the keypad until then.
      example: "2026-09-01T15:00"
      selector:
        datetime:
    slot:
      name: Slot Number
      description: Preferred slot number (optional, auto-selected if not provided)
      example: 10
      selector:
        number:
          min: 0
          max: 99
          mode: box
    force:
      name: Force Overwrite
      description: Force overwrite if slot is occupied
      default: false
      selector:
        boolean:
    locks:
      name: Locks
      description: >-
        Locks this person can open (lock entity ids or config entry ids). The
        same slot is used on every lock. Defaults to the original lock.
      example: '["lock.front_door", "lock.back_door"]'
      selector:
        entity:
          domain: lock
          multiple: true

remove_code:
  name: Remove Code
  description: Remove a PIN code from the lock
  fields:
    slot:
      name: Slot Number
      description: Slot number to remove
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 99
          mode: box

update_expiry:
  name: Update Expiry
  description: Update the expiry date of a code
  fields:
    slot:
      name: Slot Number
      description: Slot number to update
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 99
          mode: box
    expiry:
      name: Expiry Date
      description: >-
        New expiry date/time (ISO format YYYY-MM-DD or YYYY-MM-DDTHH:MM,
        or leave empty to remove)
      example: "2027-01-31T09:00"
      selector:
        datetime:

update_start:
  name: Update Start Date
  description: >-
    Update the scheduled start date/time of a code. Pushing it into the
    future pulls the PIN off the lock immediately; reaching now or the past
    activates it right away.
  fields:
    slot:
      name: Slot Number
      description: Slot number to update
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 99
          mode: box
    start:
      name: Start Date
      description: >-
        New start date/time (ISO format YYYY-MM-DD or YYYY-MM-DDTHH:MM,
        or leave empty to remove)
      example: "2026-09-15T15:00"
      selector:
        datetime:

update_name:
  name: Update Name
  description: Update the name of a code entry
  fields:
    slot:
      name: Slot Number
      description: Slot number to update
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 99
          mode: box
    name:
      name: Name
      description: New name for this code
      required: true
      example: "John Doe"
      selector:
        text:

update_pin:
  name: Update PIN Code
  description: Update the PIN code for an existing slot. Warning - this is irreversible and the old PIN cannot be retrieved.
  fields:
    slot:
      name: Slot Number
      description: Slot number to update
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 99
          mode: box
    pin_code:
      name: New PIN Code
      description: New 4-6 digit PIN code
      required: true
      example: "654321"
      selector:
        text:

update_locks:
  name: Update Locks
  description: >-
    Change which locks a person can open. The PIN is written to newly added
    locks and cleared from removed ones.
  fields:
    slot:
      name: Slot Number
      description: Slot number to update
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 99
          mode: box
    locks:
      name: Locks
      description: Lock entity ids or config entry ids this person can open
      required: true
      example: '["lock.front_door"]'
      selector:
        entity:
          domain: lock
          multiple: true

resync:
  name: Sync All Locks
  description: >-
    Make the locks match the shared user list: write every active person's
    PIN to the locks they can open and clear it from all others. Codes in
    slots that don't belong to any listed person are left alone.
  fields:
    locks:
      name: Locks
      description: Only sync these locks (default all)
      example: '["lock.front_door"]'
      selector:
        entity:
          domain: lock
          multiple: true

list_codes:
  name: List Codes
  description: List all PIN codes

cleanup_expired:
  name: Cleanup Expired Codes
  description: Manually trigger cleanup of all expired guest codes. This removes expired codes from both the lock and the storage.
